<!doctype html>
<html lang="en">
<head>
<title>Ferrite Frontier</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#110e18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Ferrite Frontier - UI styles (Pixel). Single committed dark look. */
:root {
  color-scheme: dark;
  --bg: #110e18;
  --bg-2: #15111f;
  --panel: #1b1726;
  --panel-2: #252036;
  --panel-3: #2f2944;
  --line: #3a3352;
  --line-2: #5b5380;
  --text: #eee8f6;
  --text-2: #a69ebb;
  --text-3: #7d7697;
  --amber: #f4a93c;
  --amber-2: #ffd08a;
  --amber-ink: #1a1206;
  --teal: #3fd0c4;
  --teal-2: #a8f4ec;
  --red: #ff5b4e;
  --green: #62e39b;
  --violet: #8d6fd1;
  --st-working: #62e39b;
  --st-idle: #8a84a0;
  --st-starved: #f4b73c;
  --st-blocked: #ff5b4e;
  --st-misfed: #ff4f9a;
  --bg-deep: #0a0810;
  --overlay: rgba(7, 5, 12, 0.74);
  --warn: #f4b73c;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-ui: 'Barlow', system-ui, 'Segoe UI', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 6px;
  --r-sm: 5px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  min-width: 0;
}
button { font: inherit; color: inherit; }
img.ico { display: inline-block; vertical-align: middle; image-rendering: auto; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }
.hud-num, .sc-v, .sc-p, .met-v, .met-p, .tt-v, .tt-n, .hud-sub, .score-table, .tool-meta, .ro-rate { font-variant-numeric: tabular-nums; }

.ff-app { min-height: 100vh; min-height: 100dvh; width: 100%; max-width: 100%; overflow-x: hidden; }
.ff-noscript { padding: 24px; color: var(--text-2); }
.screen { width: 100%; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 6px 12px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--font-ui); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.06s, color 0.12s;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn.on { color: var(--teal-2); box-shadow: inset 0 -2px 0 var(--teal); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); box-shadow: inset 0 1px 0 var(--amber-2); }
.btn.primary:hover { background: var(--amber-2); border-color: var(--amber-2); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: rgba(255, 91, 78, 0.14); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.btn.small { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.btn.big { min-height: 50px; padding: 10px 28px; font-size: 22px; font-family: var(--font-display); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.icon-btn { width: 36px; padding: 0; color: var(--text-2); }
.icon-btn:hover { color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.is-off { color: var(--text-3); }
.music-btn svg { width: 16px; height: 16px; }
.speed-btn { width: 44px; padding: 0; font-family: var(--font-mono); }

.eyebrow { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal-2); }

/* ---------- title ---------- */
.title-screen { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.title-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title-veil { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 50% 45%, rgba(17, 14, 24, 0.5) 0%, rgba(17, 14, 24, 0.84) 60%, rgba(17, 14, 24, 0.97) 100%); }
.title-top { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 6px; }
.title-card { position: relative; z-index: 1; text-align: center; max-width: 560px; }
.logo { margin: 10px 0 8px; font-family: var(--font-display); font-weight: 800; line-height: 0.9; letter-spacing: 0.04em; text-transform: uppercase;
  font-size: clamp(54px, 16vw, 112px); display: flex; flex-direction: column; align-items: center; }
.logo span { color: var(--text); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
.logo .logo-2 { color: var(--amber); }
.tagline { color: var(--text-2); font-size: 16px; margin: 6px auto 26px; max-width: 420px; }
.fine { color: var(--text-3); font-size: 12px; margin-top: 18px; }

/* ---------- bars ---------- */
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-height: 52px; }
.bar-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.bar-sub { color: var(--text-2); font-size: 13px; }
.bar-name { font-family: var(--font-display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

/* ---------- contract list ---------- */
.list-screen { min-height: 100vh; min-height: 100dvh; padding-bottom: 32px; }
.list-intro { color: var(--text-2); max-width: 1040px; margin: 16px auto 4px; padding: 0 16px; }
.contracts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; padding: 14px 16px; max-width: 1040px; margin: 0 auto; }
.contract { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 14px; cursor: pointer; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); color: var(--text);
  transition: border-color 0.12s, transform 0.08s, background 0.12s; }
.contract:hover:not(:disabled) { border-color: var(--amber); background: var(--panel-2); }
.contract:active:not(:disabled) { transform: translateY(1px); }
.contract.done { box-shadow: inset 3px 0 0 var(--teal); }
.contract.open { box-shadow: inset 3px 0 0 var(--amber); }
.contract.locked { opacity: 0.55; cursor: not-allowed; }
.contract > * { width: 100%; }
.c-head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.c-num { font-family: var(--font-mono); color: var(--text-3); font-size: 13px; }
.c-name { font-family: var(--font-display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: 0.06em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-state { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
.c-state.done { color: var(--teal-2); }
.c-state.open { color: var(--amber-2); }
.c-state.locked { color: var(--text-3); }
.c-goal { display: flex; align-items: center; gap: 8px; color: var(--text-2); flex-wrap: wrap; }
.c-cap { font-family: var(--font-mono); font-size: 12px; color: var(--amber-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.c-locked { color: var(--text-3); font-size: 13px; }
.c-mets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.met { display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 8px; }
.met-k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
.met-v { font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
.met-p { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.met.beat { border-color: rgba(56, 198, 176, 0.55); }
.met.beat .met-v { color: var(--teal-2); }

/* ---------- play screen layout ---------- */
.play-screen { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 480px; }
.play-bar { flex-shrink: 0; }
.brief { flex-shrink: 0; padding: 10px 14px 12px; background: linear-gradient(180deg, rgba(56, 198, 176, 0.08), rgba(56, 198, 176, 0.02)); border-bottom: 1px solid var(--line); }
.brief-text { margin: 0 0 6px; max-width: 900px; color: var(--text); }
.tut { margin: 4px 0 8px; padding-left: 18px; color: var(--text-2); max-width: 900px; }
.tut li { margin: 2px 0; }
.hint-text { margin: 4px 0 8px; padding: 6px 10px; border-left: 3px solid var(--amber); background: rgba(242, 165, 49, 0.08); color: var(--amber-2); max-width: 900px; }
.brief-actions { display: flex; gap: 8px; }

.hud { flex-shrink: 0; display: flex; gap: 10px; align-items: stretch; padding: 8px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hud-block { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; min-width: 0; }
.hud-goal { flex: 2 1 260px; display: flex; flex-direction: column; gap: 6px; }
.hud-goal-head { display: flex; align-items: center; gap: 8px; }
.hud-goal-txt { display: flex; flex-direction: column; min-width: 0; }
.hud-k { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-num { font-family: var(--font-mono); font-size: 15px; font-weight: 500; white-space: nowrap; }
.hud-num.warn, .hud-sub.warn { color: var(--warn); }
.hud-num.bad { color: var(--red); }
.hud-issues:empty { display: none; }
.hud-issues { font-size: 12px; color: var(--text-2); min-height: 16px; cursor: default; }
.hud-issues .bad { color: var(--red); }
.hud-issues .warn { color: var(--warn); }
.hud-issues .ok { color: var(--green); }
.hud-sub { font-size: 12px; color: var(--text-2); white-space: nowrap; font-family: var(--font-mono); }
.meter { position: relative; height: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter.thin { height: 6px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--teal); border-radius: 99px; transition: width 0.15s linear, background 0.2s; }
.meter-fill.ok { background: var(--green); }
.meter-fill.hold { background: var(--teal); }
.meter-fill.hold.ok { background: var(--green); opacity: 1; }
.meter-fill.power { background: var(--teal); }
.meter-fill.power.warn { background: var(--warn); }
.meter-fill.power.hot { background: var(--red); }
.meter-target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--amber); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
.hold-row { display: flex; align-items: center; gap: 8px; }
.hold-row .meter { flex: 1; }
.hud-power { flex: 0 1 130px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.hud-score { flex: 1 1 210px; display: flex; gap: 6px; padding: 6px; }
.sc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-2); border-radius: var(--r-sm); padding: 3px 4px; border: 1px solid transparent; min-width: 0; }
.sc-k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
.sc-v { font-family: var(--font-mono); font-size: 17px; font-weight: 500; line-height: 1.15; }
.sc-p { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.sc.under { border-color: rgba(56, 198, 176, 0.45); }
.sc.under .sc-v { color: var(--teal-2); }

.play-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.side { display: contents; }
.side > .brief { order: 1; }
.side > .hud { order: 2; }
.play-main { order: 3; }
.side > .plot-actions { order: 4; }
.play-main { flex: 1 1 auto; min-height: 200px; display: flex; position: relative; }
@media (min-width: 900px) {
  .play-body { flex-direction: row; }
  .side { display: flex; flex-direction: column; width: 300px; flex-shrink: 0; overflow-y: auto; background: var(--bg-2); border-right: 1px solid var(--line); }
  .side > .brief { order: 2; border-bottom: 1px solid var(--line); border-top: 0; }
  .side > .hud { order: 1; flex-direction: column; border-bottom: 1px solid var(--line); }
  .side > .hud .hud-block { flex: 0 0 auto; }
  .side > .plot-actions { order: 3; border-top: 0; background: transparent; }
  .side .plot-status { flex-basis: 100%; text-align: left; margin-left: 0; }
  .hud-power { flex-direction: row; align-items: center; gap: 10px; }
  .hud-power .meter { flex: 1; }
}
.board-wrap { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: var(--bg-deep); }
.board { display: block; touch-action: none; cursor: default; box-shadow: 0 0 0 1px var(--line); }
.board-wrap.tool-build .board { cursor: crosshair; }
.board-wrap.tool-remove .board { cursor: not-allowed; }
.paused-tag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 3px 12px; border-radius: 99px; background: rgba(18, 16, 25, 0.85); border: 1px solid var(--amber); color: var(--amber-2);
  font-family: var(--font-display); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.12s; }
.paused-tag.show { opacity: 1; }

/* tooltip + popover */
.tip, .pop { position: absolute; left: 0; top: 0; z-index: 5; background: rgba(27, 23, 38, 0.97); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  font-size: 12.5px; color: var(--text); }
.tip { pointer-events: none; padding: 7px 10px; max-width: 280px; opacity: 0; visibility: hidden; }
.tip.show { opacity: 1; visibility: visible; }
.tip.bad { border-color: rgba(236, 91, 79, 0.75); }
.pop { padding: 10px 12px 12px; width: 270px; max-width: calc(100% - 8px); display: none; }
.pop.show { display: block; }
.pop-x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--text-2); font-size: 20px; line-height: 1; cursor: pointer; border-radius: 4px; }
.pop-x:hover { background: var(--panel-3); color: var(--text); }
.pop-info { padding-right: 22px; }
.pop-h { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 10px 0 4px; }
.pop-recipes { display: flex; flex-direction: column; gap: 4px; }
.recipe-opt { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'name rate' 'line line'; gap: 2px 8px; text-align: left; padding: 6px 8px; cursor: pointer;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text); }
.recipe-opt:hover { border-color: var(--text-3); background: var(--panel-2); }
.recipe-opt.on { border-color: var(--amber); background: rgba(242, 165, 49, 0.1); }
.ro-name { grid-area: name; font-weight: 600; }
.ro-rate { grid-area: rate; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.ro-line { grid-area: line; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }
.pop-actions { display: flex; gap: 6px; margin-top: 10px; }
.pop-actions .btn { flex: 1; }

.tt-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; margin-bottom: 2px; flex-wrap: wrap; }
.tt-sub { color: var(--text-2); margin: 2px 0; }
.tt-sub.dim { color: var(--text-3); }
.tt-bad { color: #ffb0a8; font-weight: 600; }
.st-why.st-starved { color: var(--st-starved); }
.st-why.st-blocked, .st-why.st-stalled { color: #ffa29a; }
.st-why.st-misfed { color: var(--st-misfed); }
.tt-row { display: flex; gap: 8px; align-items: center; margin: 3px 0; justify-content: space-between; }
.tt-k { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; min-width: 40px; }
.tt-v { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; font-family: var(--font-mono); }
.tt-n { font-family: var(--font-mono); color: var(--text-2); white-space: nowrap; }
.tt-v.recipe { gap: 2px; }
.rq { display: inline-flex; align-items: center; gap: 1px; }
.plus, .arrow { color: var(--text-3); margin: 0 3px; }
.buf { display: inline-flex; align-items: center; gap: 2px; padding: 0 5px 0 2px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line); }
.buf.zero { color: var(--text-3); }
.buf.full { border-color: rgba(236, 91, 79, 0.6); color: #ffb0a8; }
.tt-prog { height: 4px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.tt-prog i { display: block; height: 100%; background: var(--amber); }
.chip { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.chip.st-working, .chip.st-moving { color: var(--st-working); }
.chip.st-idle, .chip.st-empty { color: var(--st-idle); }
.chip.st-idle::before, .chip.st-empty::before { box-shadow: none; }
.chip.st-starved { color: var(--st-starved); }
.chip.st-blocked, .chip.st-stalled { color: var(--st-blocked); }
.chip.st-misfed { color: var(--st-misfed); }

/* plot actions */
.plot-actions { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-2); border-top: 1px solid var(--line); flex-wrap: wrap; min-height: 44px; }
.plot-status { color: var(--text-3); font-size: 12px; margin-left: auto; text-align: right; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 8px; border: 1px solid rgba(236, 91, 79, 0.6); border-radius: var(--r-sm); background: rgba(236, 91, 79, 0.08); color: #ffc4be; }
.plot-actions.confirming > .btn { display: none; }

/* toolbar */
.toolbar { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); justify-content: center; }
.tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 90px; min-height: 76px; padding: 6px 4px 5px; cursor: pointer;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); color: var(--text); transition: border-color 0.1s, background 0.1s, transform 0.06s; user-select: none; }
.tool:hover { border-color: var(--text-3); background: var(--panel-2); }
.tool:active { transform: translateY(1px); }
.tool.on { border: 2px solid var(--amber); padding: 5px 3px 4px; background: rgba(244, 169, 60, 0.1); box-shadow: inset 0 -3px 0 var(--amber); }
.tool-remove.on { border-color: var(--red); background: rgba(255, 91, 78, 0.12); box-shadow: inset 0 -3px 0 var(--red); }
.tool-key { position: absolute; top: 3px; right: 4px; min-width: 14px; padding: 0 3px; border-radius: 3px; font-family: var(--font-mono); font-size: 10px; line-height: 14px; color: var(--amber); background: rgba(244, 169, 60, 0.12); }
.tool-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tool-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.tool-glyph { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
.tool-glyph svg { width: 22px; height: 22px; }
.tool-remove .tool-glyph { color: var(--red); }
.tool-rot .tool-glyph { color: var(--teal-2); }
.tool-sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade 0.18s ease-out; }

.modal h2 { margin: 4px 0 4px; font-family: var(--font-display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: 0.06em; }
.modal-sub { color: var(--text-2); margin: 0 0 14px; }
.score-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); margin-bottom: 16px; }
.score-table th, .score-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); }
.score-table thead th { font-family: var(--font-ui); font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }

.nb-tag { margin-left: 6px; font-size: 10px; padding: 0 5px; border-radius: 99px; background: var(--amber); color: var(--amber-ink); font-family: var(--font-ui); font-weight: 700; text-transform: uppercase; }
.modal-unlock { margin: -6px 0 14px; padding: 6px 10px; border-left: 3px solid var(--amber); background: rgba(244, 169, 60, 0.08); color: var(--amber-2); font-weight: 600; }
.chapter { max-width: 1040px; margin: 0 auto; }
.chapter-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 16px 0; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text); }
.chapter-count { font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--text-2); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 20px; z-index: 30; transform: translate(-50%, 16px); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: var(--r);
  background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text); box-shadow: var(--shadow); font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.16s, transform 0.16s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-color: rgba(236, 91, 79, 0.7); }
.toast.good { border-color: var(--teal); }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- small screens ---------- */

}

<script>
/* ---- src/engine.js ---- */
// Ferrite Frontier — simulation engine (owner: Forge). Classic script, no deps. Defines FF.engine.
var FF = (typeof globalThis !== 'undefined' ? globalThis : window).FF = (globalThis.FF || {});

FF.engine = (function () {
  'use strict';

  var TICKS_PER_MIN = 600;
  var HOLD_TICKS = 300;
  var EXTRAPOLATE_MIN = 150;   // rate() extrapolates only after this many ticks
  var MINER_TICKS = 20;
  var MAX_EXTRA_PASSES = 8;    // cap on the repeat transfer passes a tick may run when the factory has a loop
  var DX = [0, 1, 0, -1];
  var DY = [-1, 0, 1, 0];

  // ---------------------------------------------------------------- data tables
  var ITEMS = {
    ferrite_ore:   { name: 'Ferrite ore',   color: '#8b4a2f' },
    cuprite_ore:   { name: 'Cuprite ore',   color: '#3a9e88' },
    ferrite_bar:   { name: 'Ferrite bar',   color: '#8f9aa5' },
    copper_bar:    { name: 'Copper bar',    color: '#d27a36' },
    plate:         { name: 'Plate',         color: '#c8d2dc' },
    rod:           { name: 'Rod',           color: '#59636e' },
    bolts:         { name: 'Bolts',         color: '#d9dee4' },
    wire:          { name: 'Wire',          color: '#c9773c' },
    braced_plate:  { name: 'Braced plate',  color: '#d6a33f' },
    coil:          { name: 'Coil',          color: '#b8744c' },
    motor_housing: { name: 'Motor housing', color: '#e2b24c' },
  };

  var RECIPES = {
    ferrite_bar:   { name: 'Ferrite bar',   building: 'smelter',     inputs: { ferrite_ore: 1 },             outputs: { ferrite_bar: 1 },   ticks: 20 },
    copper_bar:    { name: 'Copper bar',    building: 'smelter',     inputs: { cuprite_ore: 1 },             outputs: { copper_bar: 1 },    ticks: 20 },
    plate:         { name: 'Plate',         building: 'constructor', inputs: { ferrite_bar: 3 },             outputs: { plate: 2 },         ticks: 60 },
    rod:           { name: 'Rod',           building: 'constructor', inputs: { ferrite_bar: 1 },             outputs: { rod: 1 },           ticks: 40 },
    bolts:         { name: 'Bolts',         building: 'constructor', inputs: { rod: 1 },                     outputs: { bolts: 4 },         ticks: 60 },
    wire:          { name: 'Wire',          building: 'constructor', inputs: { copper_bar: 1 },              outputs: { wire: 2 },          ticks: 40 },
    braced_plate:  { name: 'Braced plate',  building: 'assembler',   inputs: { plate: 3, bolts: 6 },         outputs: { braced_plate: 1 },  ticks: 120 },
    coil:          { name: 'Coil',          building: 'assembler',   inputs: { rod: 2, wire: 4 },            outputs: { coil: 1 },          ticks: 100 },
    motor_housing: { name: 'Motor housing', building: 'assembler',   inputs: { braced_plate: 1, coil: 2 },   outputs: { motor_housing: 1 }, ticks: 200 },
  };

  // accepts: relative sides an item may enter from. outputs: relative sides items leave from.
  var BUILDINGS = {
    belt:        { name: 'Belt',        cost: 1,  power: 0,  inputs: 'belt',     recipes: [], ticksPerItem: 10, accepts: ['back', 'left', 'right'], outputs: ['front'] },
    belt2:       { name: 'Fast belt',   cost: 2,  power: 0,  inputs: 'belt',     recipes: [], ticksPerItem: 5,  accepts: ['back', 'left', 'right'], outputs: ['front'] },
    splitter:    { name: 'Splitter',    cost: 2,  power: 0,  inputs: 'splitter', recipes: [], ticksPerItem: 5,  accepts: ['back'], outputs: ['front', 'left', 'right'] },
    merger:      { name: 'Merger',      cost: 2,  power: 0,  inputs: 'merger',   recipes: [], ticksPerItem: 5,  accepts: ['back', 'left', 'right'], outputs: ['front'] },
    miner:       { name: 'Miner',       cost: 5,  power: 5,  inputs: 'none',     recipes: [], ticksPerItem: MINER_TICKS, accepts: [], outputs: ['front'] },
    smelter:     { name: 'Smelter',     cost: 4,  power: 4,  inputs: 'one',      recipes: ['ferrite_bar', 'copper_bar'], accepts: ['back', 'left', 'right'], outputs: ['front'] },
    constructor: { name: 'Constructor', cost: 6,  power: 4,  inputs: 'one',      recipes: ['plate', 'rod', 'bolts', 'wire'], accepts: ['back', 'left', 'right'], outputs: ['front'] },
    assembler:   { name: 'Assembler',   cost: 10, power: 15, inputs: 'two',      recipes: ['braced_plate', 'coil', 'motor_housing'], accepts: ['back', 'left', 'right'], outputs: ['front'] },
  };

  // internal building kinds
  var KIND_BELT = 1, KIND_SPLITTER = 2, KIND_MERGER = 3, KIND_MINER = 4, KIND_MACHINE = 5, KIND_TERMINAL = 6;
  var KIND_BY_TYPE = { belt: KIND_BELT, belt2: KIND_BELT, splitter: KIND_SPLITTER, merger: KIND_MERGER, miner: KIND_MINER,
    smelter: KIND_MACHINE, constructor: KIND_MACHINE, assembler: KIND_MACHINE };
  // relative side codes: 0 front, 1 right, 2 back, 3 left.
  var SIDES_BACK_LEFT_RIGHT = [2, 3, 1];  // accepted sides, in feeder priority order
  var SIDES_BACK_ONLY = [2];
  var NO_SIDES = [];
  var ALL_DIRECTIONS = [0, 1, 2, 3];

  function isLogistic(building) {
    return building.kind === KIND_BELT || building.kind === KIND_SPLITTER || building.kind === KIND_MERGER;
  }
  function turn(direction, steps) { return (((direction + steps) % 4) + 4) % 4; }

  // ---------------------------------------------------------------- level helpers
  var parseCache = typeof WeakMap !== 'undefined' ? new WeakMap() : null;

  function parseLevel(level) {
    if (parseCache && level && typeof level === 'object') {
      var cached = parseCache.get(level);
      if (cached) return cached;
    }
    var map = level.map || [];
    var height = level.h || map.length;
    var width = level.w || (map[0] || '').length;
    var cells = [], terminal = null;
    for (var y = 0; y < height; y++) {
      var row = [], line = map[y] || '';
      for (var x = 0; x < width; x++) {
        var symbol = line.charAt(x) || '.';
        var cell;
        if (symbol === '#') cell = { terrain: 'rock' };
        else if (symbol === 'F') cell = { terrain: 'node', ore: 'ferrite_ore' };
        else if (symbol === 'C') cell = { terrain: 'node', ore: 'cuprite_ore' };
        else if (symbol === 'T') {
          if (!terminal) { terminal = { x: x, y: y }; cell = { terrain: 'ground', terminal: true }; }
          else cell = { terrain: 'rock' }; // only one terminal per level; extras behave as rock
        } else cell = { terrain: 'ground' };
        row.push(cell);
      }
      cells.push(row);
    }
    var parsed = { w: width, h: height, cells: cells, terminal: terminal };
    if (parseCache && level && typeof level === 'object') parseCache.set(level, parsed);
    return parsed;
  }

  function defaultRecipe(level, type) {
    var definition = BUILDINGS[type];
    if (!definition) return null;
    for (var recipeIndex = 0; recipeIndex < definition.recipes.length; recipeIndex++) {
      var recipeId = definition.recipes[recipeIndex];
      if (!level || !level.recipes || level.recipes.indexOf(recipeId) >= 0) return recipeId;
    }
    return null;
  }

  function isInteger(value) { return typeof value === 'number' && (value | 0) === value; }
  function refuse(reason) { return { ok: false, reason: reason }; }

  function canPlace(level, placements, placement) {
    if (!placement) return refuse('Nothing to place');
    var definition = BUILDINGS[placement.type];
    if (!definition) return refuse('Unknown building');
    var parsed = parseLevel(level);
    var x = placement.x, y = placement.y;
    if (!isInteger(x) || !isInteger(y) || x < 0 || y < 0 || x >= parsed.w || y >= parsed.h) return refuse('Outside the plot');
    if (level.unlocks && level.unlocks.indexOf(placement.type) < 0) return refuse('Locked in this contract');
    var cell = parsed.cells[y][x];
    if (cell.terminal) return refuse('The terminal is here');
    if (cell.terrain === 'rock') return refuse('Rock is in the way');
    if (placement.type === 'miner') {
      if (cell.terrain !== 'node') return refuse('Miners must sit on an ore node');
    } else if (cell.terrain === 'node') return refuse('Only miners fit on ore nodes');
    var dir = placement.dir;
    if (dir != null && !(dir === 0 || dir === 1 || dir === 2 || dir === 3)) return refuse('Bad direction');
    if (definition.recipes.length) {
      if (placement.recipe != null) {
        var recipe = RECIPES[placement.recipe];
        if (!recipe || recipe.building !== placement.type) return refuse('That recipe does not fit this building');
        if (level.recipes && level.recipes.indexOf(placement.recipe) < 0) return refuse('Recipe locked in this contract');
      } else if (!defaultRecipe(level, placement.type)) return refuse('No recipe available for this building');
    }
    var powerUsed = definition.power;
    var existingPlacements = placements || [];
    for (var placementIndex = 0; placementIndex < existingPlacements.length; placementIndex++) {
      var existing = existingPlacements[placementIndex];
      if (existing.x === x && existing.y === y) return refuse('Something is already here');
      var existingDefinition = BUILDINGS[existing.type];
      if (existingDefinition) powerUsed += existingDefinition.power;
    }
    if (level.powerCap != null && definition.power > 0 && powerUsed > level.powerCap) {
      return refuse('Over the power budget (' + powerUsed + '/' + level.powerCap + ' MW)');
    }
    return { ok: true };
  }

  function score(placements) {
    var cells = 0, cost = 0, power = 0;
    for (var placementIndex = 0; placementIndex < (placements || []).length; placementIndex++) {
      var definition = BUILDINGS[placements[placementIndex].type];
      if (!definition) continue;
      cells++; cost += definition.cost; power += definition.power;
    }
    return { cells: cells, cost: cost, power: power };
  }

  // ---------------------------------------------------------------- building state
  function makeBuilding(placement, plotWidth) {
    var definition = BUILDINGS[placement.type];
    var kind = KIND_BY_TYPE[placement.type];
    var building = {
      type: placement.type, x: placement.x, y: placement.y, dir: (placement.dir | 0) & 3, recipe: null,
      kind: kind, definition: definition, cellIndex: placement.y * plotWidth + placement.x,
      ticksPerItem: definition.ticksPerItem || 0,
      // logistics state (belt, splitter, merger): one item, its age in ticks, the direction it entered from
      item: null, age: 0, entryDir: 0, roundRobin: 0,
      // machine / miner state
      recipeDef: null, inputTypes: NO_SIDES, inputNeeded: NO_SIDES, inputCapacity: NO_SIDES, inputCounts: NO_SIDES,
      outputTypes: NO_SIDES, outputAmounts: NO_SIDES, outputCapacity: NO_SIDES, outputCounts: NO_SIDES,
      crafting: false, craftTicks: 0, mineTimer: 0, pushed: false, misfed: false,
      // transfer-pass bookkeeping: the pass this building last acted in; a merger's turn kept for a splitter
      passNumber: -1, reservedFor: null, reservedPass: -1,
      // topology (filled by rebuild)
      feeders: [], feederDirs: [], mergerSlots: [null, null, null], mergerSlotDirs: [0, 0, 0],
      splitterTargets: [null, null, null], splitterTargetEntryDirs: [0, 0, 0],
      downstream: [], upstream: [], unorderedDownstreamCount: 0, ordered: false,
    };
    if (kind === KIND_MACHINE) setRecipeState(building, placement.recipe, false);
    else if (kind === KIND_MINER) {
      building.outputTypes = [null]; building.outputAmounts = [1]; building.outputCapacity = [2]; building.outputCounts = [0];
    }
    return building;
  }

  function setRecipeState(building, recipeId, keepMatchingItems) {
    var recipe = RECIPES[recipeId];
    var oldInputTypes = building.inputTypes, oldInputCounts = building.inputCounts;
    var oldOutputTypes = building.outputTypes, oldOutputCounts = building.outputCounts;
    building.recipe = recipeId; building.recipeDef = recipe;
    building.inputTypes = []; building.inputNeeded = []; building.inputCapacity = []; building.inputCounts = [];
    building.outputTypes = []; building.outputAmounts = []; building.outputCapacity = []; building.outputCounts = [];
    var itemType, oldIndex;
    for (itemType in recipe.inputs) {
      var inputCapacity = 2 * recipe.inputs[itemType];
      building.inputTypes.push(itemType); building.inputNeeded.push(recipe.inputs[itemType]); building.inputCapacity.push(inputCapacity);
      var inputKept = 0;
      if (keepMatchingItems) { oldIndex = oldInputTypes.indexOf(itemType); if (oldIndex >= 0) inputKept = Math.min(oldInputCounts[oldIndex], inputCapacity); }
      building.inputCounts.push(inputKept);
    }
    for (itemType in recipe.outputs) {
      var outputCapacity = Math.max(2, 2 * recipe.outputs[itemType]);
      building.outputTypes.push(itemType); building.outputAmounts.push(recipe.outputs[itemType]); building.outputCapacity.push(outputCapacity);
      var outputKept = 0;
      if (keepMatchingItems) { oldIndex = oldOutputTypes.indexOf(itemType); if (oldIndex >= 0) outputKept = Math.min(oldOutputCounts[oldIndex], outputCapacity); }
      building.outputCounts.push(outputKept);
    }
    building.crafting = false; building.craftTicks = 0;
  }

  function clearState(building) {
    building.item = null; building.age = 0; building.entryDir = 0; building.roundRobin = 0;
    building.crafting = false; building.craftTicks = 0; building.mineTimer = 0; building.pushed = false; building.misfed = false;
    building.reservedFor = null; building.reservedPass = -1;
    for (var inputIndex = 0; inputIndex < building.inputCounts.length; inputIndex++) building.inputCounts[inputIndex] = 0;
    for (var outputIndex = 0; outputIndex < building.outputCounts.length; outputIndex++) building.outputCounts[outputIndex] = 0;
  }

  // does building `sender` emit items in absolute direction `direction`?
  function outputsTo(sender, direction) {
    if (sender.kind === KIND_TERMINAL) return false;
    if (sender.kind === KIND_SPLITTER) return direction === sender.dir || direction === turn(sender.dir, 3) || direction === turn(sender.dir, 1);
    return direction === sender.dir;
  }
  // splitter output slot for an absolute direction: 0 front, 1 left, 2 right (its round-robin order)
  function splitterSlot(splitter, direction) { return direction === splitter.dir ? 0 : (direction === turn(splitter.dir, 3) ? 1 : 2); }

  function acceptedSides(building) {
    switch (building.kind) {
      case KIND_BELT: case KIND_MERGER: case KIND_MACHINE: return SIDES_BACK_LEFT_RIGHT;
      case KIND_SPLITTER: return SIDES_BACK_ONLY;
      default: return NO_SIDES;
    }
  }

  // feeder helpers -------------------------------------------------------------
  // Type of the item `feeder` could hand off this tick, or null. Splitters push to their outputs; only a merger asks
  // a splitter, so that a splitter-fed merger side counts as waiting in its round robin (see _mergerPull).
  function readyItemType(feeder) {
    var kind = feeder.kind;
    if (kind === KIND_BELT || kind === KIND_MERGER || kind === KIND_SPLITTER) {
      return (feeder.item !== null && feeder.age >= feeder.ticksPerItem) ? feeder.item.type : null;
    }
    if (kind === KIND_MACHINE || kind === KIND_MINER) {
      if (feeder.pushed) return null; // one item per tick, also when the transfer pass repeats (loops)
      var outputCounts = feeder.outputCounts;
      for (var outputIndex = 0; outputIndex < outputCounts.length; outputIndex++) if (outputCounts[outputIndex] > 0) return feeder.outputTypes[outputIndex];
    }
    return null;
  }

  // Loop fallback for the processing order. Runs Tarjan's algorithm over the nodes that are not ordered yet,
  // following item flow from startNode. The first strongly connected component it completes is a loop with no
  // unordered node downstream of it; the result is that loop's lowest-index node. Breaking the order there keeps
  // every line that leads INTO a loop downstream-first (it used to run upstream-first and lose a tick per item).
  function findLoopBreak(unorderedNodes, startNode) {
    var nodeIndex, nextVisitIndex = 0, visitStack = [], breakNode = null;
    for (nodeIndex = 0; nodeIndex < unorderedNodes.length; nodeIndex++) {
      unorderedNodes[nodeIndex].visitIndex = -1; unorderedNodes[nodeIndex].onVisitStack = false;
    }
    function visit(node) {
      node.visitIndex = node.lowLink = nextVisitIndex++;
      node.onVisitStack = true; visitStack.push(node);
      for (var downstreamIndex = 0; downstreamIndex < node.downstream.length && breakNode === null; downstreamIndex++) {
        var next = node.downstream[downstreamIndex];
        if (next.ordered) continue;
        if (next.visitIndex < 0) { visit(next); if (next.lowLink < node.lowLink) node.lowLink = next.lowLink; }
        else if (next.onVisitStack && next.visitIndex < node.lowLink) node.lowLink = next.visitIndex;
      }
      if (breakNode === null && node.lowLink === node.visitIndex) {
        var member;
        do {
          member = visitStack.pop(); member.onVisitStack = false;
          if (breakNode === null || member.cellIndex < breakNode.cellIndex) breakNode = member;
        } while (member !== node);
      }
    }
    visit(startNode);
    return breakNode;
  }

  // Remove the ready item from `feeder` without making an item object (the receiver consumes it).
  function discardReadyItem(feeder) {
    if (feeder.kind === KIND_BELT || feeder.kind === KIND_MERGER) { feeder.item = null; feeder.age = 0; return; }
    var outputCounts = feeder.outputCounts;
    for (var outputIndex = 0; outputIndex < outputCounts.length; outputIndex++) {
      if (outputCounts[outputIndex] > 0) { outputCounts[outputIndex]--; feeder.pushed = true; return; }
    }
  }

  // ---------------------------------------------------------------- Sim
  function Sim(level, placements) {
    this.level = level;
    var parsed = this.map = parseLevel(level);
    this.width = parsed.w; this.height = parsed.h;
    this.goal = level.goal || null;
    this.grid = new Array(parsed.w * parsed.h);
    for (var cellIndex = 0; cellIndex < this.grid.length; cellIndex++) this.grid[cellIndex] = null;
    this.buildings = [];
    this.order = [];
    this.terminal = null;
    if (parsed.terminal) {
      this.terminal = { kind: KIND_TERMINAL, type: 'terminal', x: parsed.terminal.x, y: parsed.terminal.y,
        cellIndex: parsed.terminal.y * parsed.w + parsed.terminal.x, dir: 0,
        feeders: [], feederDirs: [], downstream: [], upstream: [], unorderedDownstreamCount: 0, ordered: false, splitterTargets: null,
        passNumber: -1 };
      this.grid[this.terminal.cellIndex] = this.terminal;
    }
    this._nextItemId = 1;
    this._passNumber = 0;
    this._lateMergerPull = false;
    this.rejected = [];
    this._resetCounters();
    var initialPlacements = placements || [];
    for (var placementIndex = 0; placementIndex < initialPlacements.length; placementIndex++) {
      var result = this._add(initialPlacements[placementIndex]);
      if (!result.ok) this.rejected.push({ placement: initialPlacements[placementIndex], reason: result.reason });
    }
    this._rebuild();
  }

  Sim.prototype._resetCounters = function () {
    this.elapsed = 0;
    this.received = {};
    this.arrivals = {};
    this.arrivalsHead = {};
    this.holdTicks = 0;
    this.success = false;
    this.successTick = null;
    this.maxRate = 0;
    this.goalRate = 0;
    this.stats = { delivered: 0, crafted: 0, mined: 0 };
  };

  Sim.prototype._plainPlacements = function () {
    var plain = new Array(this.buildings.length);
    for (var buildingIndex = 0; buildingIndex < this.buildings.length; buildingIndex++) {
      var building = this.buildings[buildingIndex];
      var placement = { type: building.type, x: building.x, y: building.y, dir: building.dir };
      if (building.kind === KIND_MACHINE) placement.recipe = building.recipe;
      plain[buildingIndex] = placement;
    }
    return plain;
  };

  Object.defineProperty(Sim.prototype, 'placements', { get: function () { return this._plainPlacements(); } });

  Sim.prototype._add = function (placement) {
    var check = canPlace(this.level, this._plainPlacements(), placement);

  // ------------------------------------------------------------------ chapters and unlocking

  // ------------------------------------------------------------------ rendering

      var maxTicks = Math.ceil(15 * play.speed); // at most 0.25 s of catch-up per frame
      if (ticks > maxTicks) { ticks = maxTicks; play.acc = 0; }
      if (ticks > 0) { try { sim.tick(ticks); } catch (error) { console.error(error); play.paused = true; paintPause(); toast('Simulation error; paused.', 'bad'); } }
    }
    // events
    var goalProgress = null;
    try { goalProgress = sim.getGoalProgress(); } catch (error) { goalProgress = null; }
    if (goalProgress && goalProgress.success && !play.lastSuccess) onLiveSuccess();
    play.lastSuccess = !!(goalProgress && goalProgress.success);
    try {
      var st = sim.getStats ? sim.getStats() : null;
      if (st) {
        if (play.prevStats && st.delivered > play.prevStats.delivered) sfx('deliver');
        else if (play.prevStats && st.crafted > play.prevStats.crafted) sfx('craft');
        play.prevStats = st;
      } else {
        var term = sim.getTerminal(), total = 0;
        for (var item in term.received) total += term.received[item] || 0;
        if (play.prevReceived >= 0 && total > play.prevReceived) sfx('deliver');
        play.prevReceived = total;
      }
    } catch (error) { /* ignore */ }

    // draw
    var ctx = dom.canvas.getContext('2d'), cellSize = play.cellSize;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // Board pixels are device pixels (cellSize = CSS cell size x dpr, identity transform), so cell edges land on
    // whole device pixels; this matches Iris's setTransform(dpr) recipe in resolution.
    ctx.fillStyle = pal('bgDeep', '#0a0810');
    ctx.fillRect(0, 0, dom.canvas.width, dom.canvas.height);
    var overlay = { sel: play.sel, hide: null, smooth: play.smooth || (play.smooth = {}), terrain: play.terrainCache || (play.terrainCache = {}),
      hover: (!play.tool && play.pointerType === 'mouse' && !play.drag) ? play.hover : null, frac: play.paused ? 0 : clamp(play.acc, 0, 0.999) };
    // ghosts
    var ghosts = [];
    if (play.tool && play.tool !== 'remove' && play.hover && (play.pointerType === 'mouse' || play.drag)) {
      var path = (play.drag && play.drag.mode === 'build') ? play.drag.path : [play.hover];
      var key = play.version + '|' + play.tool + '|' + play.dir + '|' + path.map(function (cell) { return cell.x + ',' + cell.y; }).join(';');
      if (key !== play.ghostKey) { play.ghostKey = key; play.ghosts = planPath(path, play.tool); }
      ghosts = play.ghosts;
      overlay.hide = {};
      ghosts.forEach(function (ghost) { if (ghost.ok && ghost.op !== 'same' && ghost.op !== 'occupied') overlay.hide[ghost.placement.x + ',' + ghost.placement.y] = 1; });
    } else play.ghosts = [];
    drawBoard(ctx, cellSize, timeSeconds, sim, play.parsed, play.level, overlay);
    play.buildings = overlay.buildings;
    var lineWidth = Math.max(2, Math.round(cellSize / 16));
    if (ghosts.length) {
      var ghostMap = {};
      ghosts.forEach(function (ghost) { ghostMap[ghost.placement.x + ',' + ghost.placement.y] = ghost.placement; });
      var lookup = function (x, y) { return ghostMap[x + ',' + y] || (overlay.at && overlay.at(x, y)) || null; };
      ghosts.forEach(function (ghost, ghostIndex) {
        if (ghost.op === 'same' || (ghost.op === 'occupied' && ghosts.length > 1)) return;
        var ghostBuilding = { type: ghost.placement.type, x: ghost.placement.x, y: ghost.placement.y, dir: ghost.placement.dir, recipe: ghost.placement.recipe, status: 'idle', progress: 0, inputs: {}, output: {} };
        var options = { ghost: true, invalid: !ghost.ok };
        var ghostCell = play.parsed.cells[ghost.placement.y] && play.parsed.cells[ghost.placement.y][ghost.placement.x];
        if (ghostCell && ghostCell.ore) options.ore = ghostCell.ore;
        if (ghost.placement.type === 'belt' || ghost.placement.type === 'belt2') {
          var dragPath = play.drag && play.drag.mode === 'build' ? play.drag.path : null;
          options.curve = (dragPath && ghostIndex > 0) ? curveFromDir(ghost.placement.dir, dirBetween(dragPath[ghostIndex - 1], dragPath[ghostIndex])) : beltCurve(ghostBuilding, lookup);
        }
        try { drawBuilding(ctx, ghostBuilding, cellSize, timeSeconds, options); } catch (error) { /* ignore */ }
      });
    }
    // remove-mode highlight
    if (play.hover && (play.tool === 'remove' || (play.drag && play.drag.mode === 'remove'))) {
      var existing = placementAt(play.hover.x, play.hover.y);
      if (existing) {
        ctx.save(); ctx.fillStyle = 'rgba(255,70,60,0.22)'; ctx.fillRect(play.hover.x * cellSize, play.hover.y * cellSize, cellSize, cellSize); ctx.restore();
        strokeCell(ctx, play.hover.x, play.hover.y, cellSize, 'rgba(255,90,80,0.95)', lineWidth);
      } else strokeCell(ctx, play.hover.x, play.hover.y, cellSize, 'rgba(255,255,255,0.25)', Math.max(1, lineWidth / 2));
    } else if (play.hover && !play.tool && play.pointerType === 'mouse' && !placementAt(play.hover.x, play.hover.y)) {
      strokeCell(ctx, play.hover.x, play.hover.y, cellSize, 'rgba(238,232,246,0.28)', Math.max(1, lineWidth / 2));
    }
    if (play.issueHover) {
      (play.buildings || []).forEach(function (building) {
        if (!MACHINE[building.type]) return;
        var color = building.status === 'blocked' || building.status === 'misfed' ? pal('bad', '#ff5b4e') : building.status === 'starved' ? pal('warn', '#f4b73c') : null;
        if (color) strokeCell(ctx, building.x, building.y, cellSize, color, lineWidth);
      });
    }
    if (play.sel && isTerminal(play.sel.x, play.sel.y)) strokeCell(ctx, play.sel.x, play.sel.y, cellSize, pal('amber', '#f4a93c'), lineWidth);
    // placement flashes
    var nowTime = nowMs();
    play.flashes = play.flashes.filter(function (flashItem) {
      var alpha = 1 - (nowTime - flashItem.t0) / 380;
      if (alpha <= 0) return false;
      ctx.save();
      ctx.globalAlpha = alpha * 0.55;
      ctx.fillStyle = flashItem.kind === 'good' ? 'rgba(130,240,210,1)' : flashItem.kind === 'rm' ? 'rgba(255,170,90,1)' : 'rgba(255,70,60,1)';
      var grow = (1 - alpha) * cellSize * 0.12;
      ctx.fillRect(flashItem.x * cellSize - grow, flashItem.y * cellSize - grow, cellSize + grow * 2, cellSize + grow * 2);
      ctx.restore();
      return true;
    });

    // stall + hum (from building statuses)
    var buildings = play.buildings || [], working = 0, machines = 0, stalledNow = {}, newStall = false;
    for (var index = 0; index < buildings.length; index++) {
      var building = buildings[index];
      if (MACHINE[building.type]) { machines++; if (building.status === 'working') working++; }
      if (building.status === 'stalled') {
        var cellKey = building.x + ',' + building.y;
        stalledNow[cellKey] = 1;
        if (!play.stalled[cellKey]) newStall = true;
      }
    }
    play.stalled = stalledNow;
    if (newStall && !play.paused && nowTime - play.lastStallSnd > 2500) { play.lastStallSnd = nowTime; sfx('stall'); }
    var busy = play.paused || !machines ? 0 : working / machines;
    hum(busy);
    musicCall('setIntensity', busy);

    updateHUD(false);
    if (nowTime - play.lastTipAt > 90) { play.lastTipAt = nowTime; updateTip(); if (play.sel) { refreshPop(false); positionPop(); } }
  }

  // ------------------------------------------------------------------ main loop
  var lastTs = 0, loopErrors = 0;
  function frame(timestamp) {
    requestAnimationFrame(frame);
    var deltaSeconds = lastTs ? (timestamp - lastTs) / 1000 : 0;
    lastTs = timestamp;
    deltaSeconds = clamp(deltaSeconds, 0, 0.25);
    try {
      if (screen === 'play' && play) playFrame(deltaSeconds, timestamp / 1000);
      else if (screen === 'title' && titleState) titleFrame(deltaSeconds, timestamp / 1000);
    } catch (error) {
      if (loopErrors++ < 5) console.error(error);
    }
  }

  // The style guide asks for colors to come from FF.art.palette: mirror them into the CSS custom properties.
  function applyPalette() {
    var palette = ART.palette || {}, st = document.documentElement.style;
    var map = { bg: '--bg', bgDeep: '--bg-deep', panel: '--panel', panelHi: '--panel-2', panelEdge: '--line', panelEdgeHi: '--line-2',
      overlay: '--overlay', text: '--text', textDim: '--text-2', amber: '--amber', amberHi: '--amber-2', teal: '--teal', tealHi: '--teal-2',
      good: '--green', warn: '--warn', bad: '--red', misfed: '--st-misfed' };
    for (var key in map) if (typeof palette[key] === 'string') st.setProperty(map[key], palette[key]);
    var statusColors = palette.status || {};
    ['working', 'starved', 'blocked'].forEach(function (status) { if (statusColors[status]) st.setProperty('--st-' + status, statusColors[status]); });
  }

  function boot() {
    root = document.getElementById('ff-app');
    if (!root) { root = make('div', { id: 'ff-app', class: 'ff-app' }); document.body.appendChild(root); }
    if (!engine || !ART) {
      root.innerHTML = '<p class="ff-noscript">Ferrite Frontier failed to load (missing ' + (!engine ? 'engine' : 'art') + ').</p>';
      return;
    }
    applyPalette();
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', function () { ensureAudio(); }, { capture: true });
    window.addEventListener('resize', function () { if (play) fitBoard(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) hum(0); lastTs = 0; });
    showTitle();
    requestAnimationFrame(frame);
  }

  FF.ui = { boot: boot, _state: function () { return { screen: screen, play: play }; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
if (typeof module !== 'undefined') module.exports = FF.ui;

</script>
</body>
</html>
