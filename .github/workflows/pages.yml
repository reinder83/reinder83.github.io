name: Deploy public planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Two jobs, as in GitHub's Pages template: the deploy job starts after the build job has finished, so the uploaded
# github-pages artifact is visible to it. With upload and deploy in one job, deploy-pages sometimes found no artifact.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Collect website files
        run: |
          mkdir _site
          cp index.html _site/
          if [ -d satisfactory-planner ]; then cp -R satisfactory-planner _site/; fi
          if [ -d ferrite-frontier ]; then cp -R ferrite-frontier _site/; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
